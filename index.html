<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loup-Garou Minecraft - Documentation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <!-- Menu Burger -->
    <div class="menu-burger">
        <button id="menu-toggle" class="menu-toggle">☰</button>
    </div>

    <!-- Navigation Sidebar -->
    <nav class="nav-sidebar" id="nav-sidebar">
        <button class="nav-btn active" data-tab="doc">📄 Doc</button>
        <button class="nav-btn" data-tab="boutique">🛍️ Boutique</button>
    </nav>

    <!-- Doc Tab -->
    <div class="tab-content active" id="doc-tab">
        <div class="toolbar">
            <button id="prev-page" class="btn">◀ Précédent</button>
            <input type="number" id="page-num" class="page-input" min="1" value="1">
            <span id="page-count" class="page-count">/ 0</span>
            <button id="next-page" class="btn">Suivant ▶</button>
            
            <button id="zoom-out" class="btn">🔍-</button>
            <span id="zoom-level" class="zoom-level">100%</span>
            <button id="zoom-in" class="btn">🔍+</button>
        </div>

        <div class="pdf-viewer">
            <div id="pdf-render" class="pdf-render"></div>
            <div id="loading" class="loading">Chargement du PDF...</div>
        </div>
    </div>

    <!-- Boutique Tab -->
    <div class="tab-content" id="boutique-tab">
        <div class="boutique-container">
            <h1 class="boutique-title">Grades</h1>
            <div class="grades-grid">
                <div class="grade-card">
                    <div class="grade-header"></div>
                    <div class="grade-body">
                        <button class="btn-acheter">Acheter</button>
                    </div>
                </div>

                <div class="grade-card">
                    <div class="grade-header"></div>
                    <div class="grade-body">
                        <button class="btn-acheter">Acheter</button>
                    </div>
                </div>

                <div class="grade-card">
                    <div class="grade-header"></div>
                    <div class="grade-body">
                        <button class="btn-acheter">Acheter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="pdf-viewer.js"></script>
</body>
</html>
